<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatos Anna Amour | Fotos aleatórias de gatinhos</title>
    <meta
      name="description"
      content="Site da Anna: descubra uma nova foto aleatória de gatinho a cada clique, direto da The Cat API."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pedro-resende-vevo.github.io/" />
    <meta name="theme-color" content="#9999ff" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gatos Anna Amour" />
    <meta
      property="og:description"
      content="Uma nova foto aleatória de gatinho a cada clique."
    />
    <meta property="og:url" content="https://pedro-resende-vevo.github.io/" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gatos Anna Amour" />
    <meta
      name="twitter:description"
      content="Uma nova foto aleatória de gatinho a cada clique."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #99f;
      }

      h1 {
        all: unset;
        display: block;
        font-size: 1.5rem;
      }

      button {
        background-color: black;
        color: white;
        border: white groove 2px;
        box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.685);
        border-radius: 15px;
        font-size: 3rem;
        padding: 0.25em;
      }

      button:focus-visible {
        outline: 3px solid #ffcc00;
        outline-offset: 2px;
      }

      header {
        background-color: wheat;
        text-align: center;
        margin-bottom: 1em;
        padding: 0.5em;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 50px;
        justify-content: start;
        align-items: center;
      }

      img {
        max-width: 70%;
        min-width: 70%;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>
        Sempre uma nova foto de <strong>gatinhos</strong> totalmente
        aleatória
      </h1>
    </header>
    <main>
      <button type="button" id="btn-load-cat" aria-label="Carregar novo gatinho">
        🐱
      </button>
      <img src="" alt="Foto aleatória de um gatinho" id="img" />
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
      <noscript>
        <p>
          Ative o JavaScript no seu navegador para ver fotos de gatinhos.
        </p>
      </noscript>
    </main>

    <script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous"
    ></script>
    <script>
      function loadCat() {
        $("#status").text("Carregando novo gatinho...");
        fetch("https://api.thecatapi.com/v1/images/search")
          .then((resposta) => resposta.json())
          .then((r) => {
            $("#img").attr("src", r[0]["url"]);
            $("#status").text("Novo gatinho carregado.");
          })
          .catch(() => {
            $("#status").text(
              "Não foi possível carregar um gatinho. Tente novamente."
            );
          });
      }

      $("#btn-load-cat").on("click", loadCat);
      loadCat();
    </script>
  </body>
</html>
<!-- https://api.thecatapi.com/v1/images/search -->
