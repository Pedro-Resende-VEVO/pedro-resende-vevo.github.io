<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gatos Anna Amour</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

  </head>

  <body>
    <script
      src="https://code.jquery.com/jquery-3.7.0.js"
      integrity="sha256-JlqSTELeR4TLqP0OG9dxM7yDPqX1ox/HfgiSLBj8+kM="
      crossorigin="anonymous"
    ></script>
  </body>

  <body>
    <header>
      <h1>
        Sempre uma nova foto/vídeo de <strong>gatinhos</strong> totalmente
        aleatória
      </h1>
    </header>
    <main>
      <button onclick="loadCat()">🐱</button>
      <img src="" alt="Imagem de gatinho" id="img" />
    </main>

    <script>
      function loadCat() {
        fetch("https://api.thecatapi.com/v1/images/search")
          .then((resposta) => resposta.json())
          .then((r) => $("img").attr("src", r[0]["url"]));
      }

      loadCat();
    </script>

    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #99f;
      }

      h1 {
        all: unset;
        font-size: 1.5rem;
      }

      button {
        background-color: black;
        border: white groove 2px;
        box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.685);
        border-radius: 15px;
        font-size: 3rem;
      }

      header {
        background-color: wheat;
        text-align: center;
        margin-bottom: 1em;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 50px;
        justify-content: start;
        align-items: center;
      }

      img {
        max-width: 70%;
        min-width: 70%;
      }
    </style>
  </body>
</html>
<!-- https://api.thecatapi.com/v1/images/search -->
